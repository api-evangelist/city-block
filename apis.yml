name: City Block
description: Cityblock Health is a value-based healthcare provider delivering integrated
  primary care, behavioral health, and social-services support to Medicaid and lower-income
  (dual-eligible) Medicare populations across multiple U.S. markets. Cityblock pairs
  community-based care teams with a proprietary care-delivery technology platform to
  coordinate wraparound care for historically underserved communities. The company
  is backed by 8vc and added to the API Evangelist network as a portfolio profile;
  it operates as a care provider and does not publish a public developer API surface.
